<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전차 외형 테스트</title><style>*{box-sizing:border-box}body{background:#101d29;color:#eef5ff;font-family:system-ui;margin:0}main{max-width:1400px;margin:auto;padding:20px}a{color:#83e1b1}p{line-height:1.6;color:#becddb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}figure{margin:0;background:linear-gradient(#294054,#1b2c39);border:1px solid #4c677a;border-radius:12px;overflow:hidden}canvas{width:100%;display:block}figcaption{padding:14px}.controls{display:flex;gap:18px;flex-wrap:wrap;padding:18px;background:#203343;border-radius:12px}label{display:grid;gap:8px;min-width:140px}input,select{min-height:40px}select{background:#203343;color:white;padding:10px}h2{margin-top:30px}</style><main><a href="/">← 게임으로 돌아가기</a><h1>전차 외형 테스트</h1><p>전차 4종의 기본형과 1~5단계를 비교합니다. 실제 격납고와 같은 외형 부품을 사용합니다. 여기서 조절해도 게임 저장 기록은 바뀌지 않습니다.</p><h2>부품 조합 미리보기</h2><div class="controls" id="controls"></div><div class="grid" id="custom"></div><h2>단계별 비교</h2><select id="compare" aria-label="비교할 개량"><option value="all">전체 부품 함께 개량</option></select><div id="gallery"></div><p id="status" role="status">이미지를 불러오는 중…</p></main><script type="module" src="./appearance-test.js"></script></html>
